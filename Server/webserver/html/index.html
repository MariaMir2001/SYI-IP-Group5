<!DOCTYPE html>
<html>
<head>
  <title>Position History Service for ISS</title>
  <link rel="icon" type="image/x-icon" href="/resources/PHS_favicon.png">
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=folder_code" />
  <link rel="stylesheet" href="resources/leaflet.icon-material.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>

:root {
  --header-bg: #2f3542;        /* dunkles, aber weniger gesättigtes Grau */
  --header-text: #e2e2e2;      /* heller Text */
  --sidebar-bg: #2c2f36;       /* fast identisch, damit es stimmig bleibt */
  --accent-color: #4da6c3;
  --accent-hover: #3b94af;
  --text-light: #f1f1f1;
}


 body {
  background-color: var(--sidebar-bg);
  color: var(--text-light);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

header {
  background-color: var(--header-bg);
  color: var(--header-text);
  padding: 1rem 1.5rem;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  margin-top: 10px;
  color: var(--header-text);
}

header h3 {
  font-size: 0.9rem;
  color: #6c757d;
  margin: 0;
}

#sidebar {
  background-color: var(--sidebar-bg);
  min-width: 250px;
  max-width: 250px;
  padding: 1rem;
  overflow-y: auto;
}

.btn-light {
  background-color: var(--accent-color);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  transition: background-color 0.2s ease-in-out;
}

.btn-light:hover {
  background-color: var(--accent-hover);
}

legend {
  font-size: 1rem;
  color: var(--text-light);
}

fieldset {
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
}
.form_legend {
  color: var(--text-light);
  font-weight: bold;
  margin-bottom: 0.5rem;
}

.input_datetime::placeholder {
  color: #ffffff;
  opacity: 1;
}


.input_datetime {
  background-color: #2e3440;
  color: #e8f0fa !important;       /* gut lesbar */
  border: 1px solid #444c56;
  font-size: 1rem;
}


#map {
  width: 100%;
  height: 100%;
}


.form-control{
  background-color: #3c3f41;

}  
#sidebarWrapper {
  display: flex;
  flex-direction: row;
  transition: all 0.3s ease;
}

.sidebar.hidden {
  display: none !important;
}

#sidebarToggle {
  background-color: var(--header-bg);
  color: white;
  border: none;
  width: 24px;
  height: 24px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: margin-left 0.3s ease;
}

/* Wenn Sidebar versteckt ist, Button nach links außen schieben */
.sidebar.hidden #sidebarToggle {
  margin-left: -32px;
}

#toggleIcon {
  transition: transform 0.3s ease;
}

.sidebar.hidden #toggleIcon {
  transform: rotate(180deg);
}






</style>
</head>
<body>

<header>
  <div class="d-flex align-items-center">
    <img src="./resources/PHS_icon-small.png" alt="ISS Icon" style="height: 40px;" class="me-3">
    <div>
      <h1>Position History Service for ISS</h1>
      <h3>SYI Integration Project Group 5</h3>
    </div>
  </div>
  <a href="https://github.com/wi24m042/SYI-IP-Group5" class="text-decoration-none d-flex align-items-center" style="color: var(--header-text);">
    <span class="material-symbols-outlined me-1">folder_code</span> GitHub
  </a>
</header>

<div class="container-fluid px-0">
<div id="sidebarWrapper" class="d-flex flex-row w-100" style="height: calc(100vh - 80px);">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar sidebar-visible">
      <button class="btn btn-outline-light d-md-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar">✕</button>
      <form>
        <fieldset class="mb-4 border border-light p-2">
          <legend class="form_legend">Choose a protocol:</legend>
          <div class="form-check">
            <input type="radio" id="radio_rest" name="choice" value="rest" class="form-check-input" checked>
            <label for="radio_rest" class="form-check-label">REST API via webserver</label>
          </div>
          <div class="form-check">
            <input type="radio" id="radio_soap" name="choice" value="soap" class="form-check-input">
            <label for="radio_soap" class="form-check-label">SOAP via api provider</label>
          </div>
        </fieldset>

        <fieldset class="mb-4 border border-light p-2">
          <legend class="form_legend">Get Location History:</legend>
          <input type="text" id="get_location_history_form_input_starttime" class="form-control input_datetime mb-2" placeholder="Click to select Start Time">
          <input type="text" id="get_location_history_form_input_stoptime" class="form-control input_datetime mb-2" placeholder="Click to select Stop Time">
          <button id="get_location_history_form_button_submit" class="btn btn-light w-100" type="button">Submit</button>
        </fieldset>

        <fieldset class="border border-light p-2">
          <legend class="form_legend">Get Closest Entry By Timestamp:</legend>
          <input type="text" id="get_closest_entry_by_timestamp_form_input_timestamp" class="form-control input_datetime mb-2" placeholder="Click to select Timestamp">
          <button id="get_closest_entry_by_timestamp_form_button_submit" class="btn btn-light w-100" type="button">Submit</button>
        </fieldset>
      </form>
    </div>
    <button id="sidebarToggle" class="btn btn-outline-light" type="button">
      <span id="toggleIcon">◀</span>
    </button>
    <!-- Map area -->
    <div class="flex-grow-1 position-relative">
      <!-- Mobile menu toggle -->
      <button class="btn btn-outline-secondary d-md-none m-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar">☰ Menu</button>
      <div id="map" class="h-100 w-100"></div>
    </div>
  </div>
</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="resources/leaflet.icon-material.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
var map, marker;
var selectedTimestamp = null;
var selectedStartTime = null;
var selectedStopTime = null;
var DatePickerTimestamp = null;
var DatePickerStartTime = null;
var DatePickerStopTime = null;
var issMarkers = [];
console.log
const RestHeaders = new Headers();
RestHeaders.append('Content-Type', 'application/json');

const HomeIcon = L.IconMaterial.icon(
{
  icon: 'home',
  iconColor: 'black',
  markerColor: '#00649C',
  outlineColor: '#2c2f3a',
  outlineWidth: 1,
  iconSize: [31, 42]
});

const SatelliteIcon = L.IconMaterial.icon(
{
  icon: 'satellite_alt',
  iconColor: 'black',
  markerColor: '#8BB31D',
  outlineColor: '#2c2f3a',
  outlineWidth: 1,
  iconSize: [31, 42]
});

function createMap(position)
{
  var lat = position.coords.latitude;
  var lon = position.coords.longitude;

  //map = L.map('map').setView([lat, lon], 2);
  map = L.map('map', {
  zoomControl: false
  }).setView([lat, lon], 2);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', 
    {
      maxZoom: 19,
      attribution: '© OpenStreetMap | Position History Service for ISS by SYI Integration Project Group 5',
    }
  ).addTo(map);

  marker = L.marker([lat, lon], {icon: HomeIcon}).addTo(map).bindPopup("You are here!<br>Latitude: " + lat + "<br>Longitude: " + lon).bindTooltip("You are here!<br>Latitude: " + lat + "<br>Longitude: " + lon);
}

function handleLocationError(error) 
{
  alert("Error getting location: " + error.message + "\nPlease allow location access to see your position on the map.");
  location.reload();
}

function getLocation() 
{
  if (navigator.geolocation)
  {
    navigator.geolocation.getCurrentPosition(createMap, handleLocationError);
  } 
  else 
  {
    alert("Geolocation is not supported by this browser.");
  }
}

async function perform_rest_request(RestRequest)
{
  console.log("Performing REST request:", RestRequest);
  const RestResponse = await fetch(RestRequest);
  const JSON_List = await RestResponse.json();
  console.log("REST response JSON:", JSON_List);
  JSON_List.forEach(entry => 
  {
    const timestamp = entry.timestamp;
    const latitude = entry.latitude;
    const longitude = entry.longitude;
    const source = entry.source;
    const timestamp_human_readable = new Date(timestamp * 1000).toLocaleString();
    issMarker = L.marker([latitude, longitude], {icon: SatelliteIcon}).addTo(map).bindPopup("Latitude: " + latitude + "<br>Longitude: " + longitude + "<br>Timestamp: " + timestamp_human_readable + "<br>Source: " + source).bindTooltip("Latitude: " + latitude + "<br>Longitude: " + longitude + "<br>Timestamp: " + timestamp_human_readable + "<br>Source: " + source);
    issMarkers.push(issMarker);
  });  
}

async function perform_soap_request(SoapBody, ResponseNamespace) 
{
  console.log("Performing SOAP request with body:", SoapBody);
  const SoapResponse = await fetch('https://ntgddns.asuscomm.com:8000/', 
  {
    method: 'POST',
    headers: 
    {
      'Content-Type': 'application/soap+xml;'
    },
    body: SoapBody
  });

  const SoapResponseContent = await SoapResponse.text();
  const XmlParser = new DOMParser();
  const XmlDoc = XmlParser.parseFromString(SoapResponseContent, "application/xml");
  const XmlEntries = XmlDoc.getElementsByTagNameNS("*", ResponseNamespace);
  console.log("SOAP response XML:", XmlEntries);
  Array.from(XmlEntries).forEach(entry => 
  {
    const timestamp = parseInt(entry.getElementsByTagNameNS("*", "timestamp")[0].textContent);
    const latitude = parseFloat(entry.getElementsByTagNameNS("*", "latitude")[0].textContent);
    const longitude = parseFloat(entry.getElementsByTagNameNS("*", "longitude")[0].textContent);
    const source = entry.getElementsByTagNameNS("*", "source")[0].textContent;

    const timestamp_human_readable = new Date(timestamp * 1000).toLocaleString();
    issMarker = L.marker([latitude, longitude], {icon: SatelliteIcon}).addTo(map).bindPopup("Latitude: " + latitude + "<br>Longitude: " + longitude + "<br>Timestamp: " + timestamp_human_readable + "<br>Source: " + source).bindTooltip("Latitude: " + latitude + "<br>Longitude: " + longitude + "<br>Timestamp: " + timestamp_human_readable + "<br>Source: " + source);
    issMarkers.push(issMarker);
  });
}

function get_location_history()
{  
  console.log("Getting location history from " + selectedStartTime + " to " + selectedStopTime);
  const selectedOption = document.querySelector('input[name="choice"]:checked');
  if (selectedOption.value == "rest")
  {
    const RestRequest = new Request(
      "http://localhost:443/api/get_location_history",
      //location.protocol + "//" + location.hostname + ":" + location.port + "/api/get_location_history", 
      {
        method: 'POST',
        body: JSON.stringify({"PositionHistoryService": {"GetLocationHistory": {"StartTime": selectedStartTime, "StopTime": selectedStopTime}}}),
        headers: RestHeaders,
      }
    );
    perform_rest_request(RestRequest);
  }
  else if (selectedOption.value == "soap")
  {
    const SoapBody = `
      <soap12:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                        xmlns:soap12="http://www.w3.org/2003/05/soap-envelope">
        <soap12:Body>
          <GetLocationHistory xmlns="http://technikum-wien.at/mwi/integration-project/group5/position-history-service">
            <start_time>${selectedStartTime}</start_time>
            <stop_time>${selectedStopTime}</stop_time>
          </GetLocationHistory>
        </soap12:Body>
      </soap12:Envelope>
    `;
    perform_soap_request(SoapBody, "LocationRecord");
  }
}

function get_closest_entry_by_timestamp()
{
  console.log("Getting closest entry by timestamp:", selectedTimestamp);
  const selectedOption = document.querySelector('input[name="choice"]:checked');
  if (selectedOption.value == "rest")
  {
    const RestRequest = new Request(
      location.protocol + "//" + location.hostname + ":" + location.port + "/api/get_closest_entry_by_timestamp", 
      {
        method: 'POST',
        body: JSON.stringify({"PositionHistoryService": {"GetClosestEntryByTimestamp": {"Timestamp": selectedTimestamp}}}),
        headers: RestHeaders,
      }
    );
    perform_rest_request(RestRequest);
  }
  else if (selectedOption.value == "soap")
  {
    const SoapBody = `
      <soap12:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                        xmlns:soap12="http://www.w3.org/2003/05/soap-envelope">
        <soap12:Body>
          <GetClosestEntryByTimestamp xmlns="http://technikum-wien.at/mwi/integration-project/group5/position-history-service">
            <timestamp>${selectedTimestamp}</timestamp>
          </GetClosestEntryByTimestamp>
        </soap12:Body>
      </soap12:Envelope>
    `;
    perform_soap_request(SoapBody, "GetClosestEntryByTimestampResult");
  }
}

function removeIssMarkers() 
{
  issMarkers.forEach(marker => map.removeLayer(marker));
  issMarkers = [];
}

function configureDateTimePicker(inputId, input, setSelectedValue) 
{
  var thisFlatpickr = flatpickr(input, 
  {
    enableTime: true,
    dateFormat: "d.m.Y H:i",
    time_24hr: true,
    maxDate: new Date(),
    onChange: function(selectedDates) 
    {
      if (selectedDates.length > 0) 
      {
        setSelectedValue(Math.floor(selectedDates[0].getTime() / 1000));
      } 
      else 
      {
        setSelectedValue(null);
      }
      if (inputId == 'get_location_history_form_input_starttime' && DatePickerStopTime) 
      {
        DatePickerStopTime.set('minDate', selectedDates[0] || null);
      }
      if (inputId == 'get_location_history_form_input_stoptime' && DatePickerStartTime) 
      {
        DatePickerStartTime.set('maxDate', selectedDates[0] || null);
      }
    }
  });
  return thisFlatpickr;
}

function configureDateTimePickerInstance(inputId, setSelectedValue, dateTimePicker) 
{
  var setSelectedValueLocal = null;
  const input = document.getElementById(inputId);
  const dateTimePickerLocal = configureDateTimePicker(inputId, input, val => setSelectedValueLocal = setSelectedValue(val));
  input.addEventListener('focus', function() 
  {
    dateTimePickerLocal;
  });
  dateTimePicker(dateTimePickerLocal);
}

function configureSubmitButton(buttonId, isValid, onSubmit) 
{
  document.getElementById(buttonId).addEventListener('click', function() 
  {
    if (isValid()) 
    {
      removeIssMarkers();
      onSubmit();
    } 
    else 
    {
      console.log("No date selected.");
    }
  });
}


document.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById("sidebar");
  const toggleBtn = document.getElementById("sidebarToggle");
  const toggleIcon = document.getElementById("toggleIcon");

  toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("hidden");

    const isHidden = sidebar.classList.contains("hidden");
    toggleIcon.textContent = isHidden ? "▶" : "◀";

    setTimeout(() => {
      if (typeof map !== "undefined") {
        map.invalidateSize();
      }
    }, 310);
  });
});



window.onload = function() 
{
  getLocation();
  configureDateTimePickerInstance('get_closest_entry_by_timestamp_form_input_timestamp', val => selectedTimestamp = val, val => DatePickerTimestamp = val);
  configureDateTimePickerInstance('get_location_history_form_input_starttime', val => selectedStartTime = val, val => DatePickerStartTime = val);
  configureDateTimePickerInstance('get_location_history_form_input_stoptime', val => selectedStopTime = val, val => DatePickerStopTime = val);
  configureSubmitButton(
    'get_closest_entry_by_timestamp_form_button_submit',
    () => !!selectedTimestamp,
    () => get_closest_entry_by_timestamp()
  );
  configureSubmitButton(
    'get_location_history_form_button_submit',
    () => !!selectedStartTime && !!selectedStopTime,
    () => get_location_history()
  );
};
</script>
</body>
</html>
